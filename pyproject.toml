[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlnm-python"
version = "0.2.0"
description = "Reproducible Python tools for robust lesion network mapping"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Morgan Hough"}]
dependencies = ["numpy>=1.26", "scipy>=1.11", "nibabel>=5.2", "matplotlib>=3.8", "joblib>=1.3", "threadpoolctl>=3.2"]

[project.optional-dependencies]
# BrainSMASH 0.11 uses np.row_stack, removed in NumPy 2.5.
annotations = ["neuromaps>=0.0.5,<0.1", "brainsmash>=0.11,<0.12", "numpy<2.5"]
eigenbrain = ["brainspace>=0.1.20,<0.3"]

[project.scripts]
rlnm = "rlnm.cli:main"

[project.urls]
Repository = "https://github.com/m9h/rlnm-python"
Upstream = "https://github.com/pBFSLab/rLNM"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/rlnm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
